{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Sign in{% endblock %}
{% block content %}
<form method="post" class="auth-card">
  <div class="brand"><span class="mark"></span>Library</div>
  <h1>Sign in</h1>
  <p class="lede">Use your staff account to manage books, members and loans.</p>
  {{ csrf() }}
  <label class="field"><span>Username</span>
    <input name="username" value="{{ username }}" autocomplete="username" required autofocus>
  </label>
  <label class="field"><span>Password</span>
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button class="btn primary wide">Sign in</button>
</form>
{% endblock %}
