{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}My account{% endblock %}
{% block content %}
<header class="page-head"><h1>My account</h1></header>
<form method="post" class="card form">
  <h2>Change password</h2>
  <p class="lede">Signed in as <span class="mono">{{ g.user.username }}</span>.</p>
  {{ csrf() }}
  <label class="field"><span>Current password</span>
    <input type="password" name="current" autocomplete="current-password" required>
  </label>
  <div class="row">
    <label class="field"><span>New password</span>
      <input type="password" name="password" autocomplete="new-password" minlength="{{ min_length }}" required>
      <small>At least {{ min_length }} characters.</small>
    </label>
    <label class="field"><span>Confirm new password</span>
      <input type="password" name="confirm" autocomplete="new-password" required>
    </label>
  </div>
  <div class="form-actions"><button class="btn primary">Change password</button></div>
</form>
{% endblock %}
